import com.github.gradle.node.pnpm.task.PnpmInstallTask
import com.github.gradle.node.pnpm.task.PnpmTask

plugins {
    id 'maven-publish'
    alias(libs.plugins.enonic.defaults)
    id 'com.enonic.xp.app'
    alias(libs.plugins.node.gradle)
}

app {
    name = "${group}.${projectName}"
    systemApp = true

    // Pin the script engine (not the XP instance default). GraalJS supports modern ES,
    // so `vp pack` can target es2023 (see vite.config.ts).
    scriptEngine = 'GraalJS'
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    implementation xplibs.api.script

    include xplibs.admin
    include xplibs.portal
    include xplibs.io
    include 'com.enonic.lib:lib-graphql:3.0.0'
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo('dev')
}

// Download + pin Node + pnpm so the build is self-contained (clean checkout / CI).
node {
    download = true
    version = '24.18.0'
    pnpmVersion = '10.33.4' // match packageManager in package.json
}

// Prod by default; `-Penv=dev` → development build (sourcemaps, no minify).
def isProd = { -> !((project.findProperty('env') ?: 'prod') in ['d', 'dev', 'development']) }

// pnpmInstall is auto-registered; freeze the lockfile in CI.
tasks.named('pnpmInstall', PnpmInstallTask) {
    if (System.getenv('CI') != null) {
        args.add('--frozen-lockfile')
    }
}

// Keep raw sources (and dev-only config) out of the jar — pnpm emits the compiled
// versions into build/resources/main instead.
tasks.named('processResources') {
    exclude 'assets/js/**'
    exclude 'assets/css/**' // Tailwind source; the build emits it as _static/main.css
    exclude '**/*.ts' // server TS emitted as .js by pnpmPack
    exclude '**/*.tsx'
    exclude '**/tsconfig.json' // type-check config, not an app resource
    exclude '**/.gitkeep'
    exclude '**/node_modules/**'
    includeEmptyDirs = false
}

// Format + lint + type-check + tests before building.
// CI must fail on violations; locally they get fixed in place.
tasks.register('pnpmCheck', PnpmTask) {
    dependsOn tasks.named('pnpmInstall')
    description = 'Check UI + server resources (fmt, lint, types, tests) with vp check + tsc.'
    group = 'verification'
    args = ['run', System.getenv('CI') != null ? 'check' : 'check:fix']
    // No inputs/outputs on purpose: a verification task should always run.
}

tasks.register('pnpmBuild', PnpmTask) {
    dependsOn tasks.named('pnpmInstall')
    dependsOn tasks.named('pnpmCheck')
    mustRunAfter tasks.named('processResources')
    description = 'Build UI resources (the section module) with Vite.'
    group = 'build'
    args = ['run', isProd() ? 'build' : 'build:dev']
    environment = ['NODE_ENV': isProd() ? 'production' : 'development']
    inputs.property 'env', project.findProperty('env') ?: 'prod' // re-run on env switch
    inputs.dir 'src/main'
    inputs.file 'vite.config.ts'
    inputs.file 'tsconfig.json'
    inputs.file 'package.json'
    outputs.dir layout.buildDirectory.dir('resources/main/assets')
}

// Compile server-side .ts → per-file CommonJS in build/resources/main (see vite.config pack).
tasks.register('pnpmPack', PnpmTask) {
    dependsOn tasks.named('pnpmInstall')
    dependsOn tasks.named('pnpmCheck')
    mustRunAfter tasks.named('processResources')
    description = 'Build server-side resources (ts -> CommonJS js) with vp pack.'
    group = 'build'
    args = ['run', 'pack:server']
    inputs.dir 'src/main'
    inputs.file 'vite.config.ts'
    inputs.file 'tsconfig.json'
    inputs.file 'package.json'
    outputs.dir layout.buildDirectory.dir('resources/main')
    outputs.cacheIf { false } // output dir overlaps processResources — caching unreliable

    // Required: vp pack runs clean:false, so without this a deleted .ts keeps shipping its .js.
    doFirst {
        delete fileTree(layout.buildDirectory.dir('resources/main')) {
            include '**/*.js'
            exclude 'assets/**'
        }
    }
}

tasks.named('jar') {
    dependsOn tasks.named('pnpmBuild')
    dependsOn tasks.named('pnpmPack')
    if (isProd()) {
        exclude 'assets/**/*.map' // don't ship dev sourcemaps in a prod jar
    }
}
