# `vite` is an alias onto vite-plus-core, so transitive ranges must not pull the real package.
# `$name` keeps both on whatever package.json pins; the alias itself is bumped by hand.
overrides:
  vite: '$vite'
  vitest: '$vitest'
# vitest peers the real vite; the alias satisfies it at runtime but not by version.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
